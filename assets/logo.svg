<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEC178" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#A8833E" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE9C91" />
      <stop offset="100%" stop-color="#C97A6E" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo suave e sutil -->
  <rect width="600" height="200" rx="20" fill="#FFFDFB" />
  <rect x="4" y="4" width="592" height="192" rx="16" fill="none" stroke="url(#roseGrad)" stroke-width="1" stroke-opacity="0.25" />

  <!-- Monograma Central / Ícone -->
  <g transform="translate(60, 100)">
    <circle cx="0" cy="0" r="46" fill="#FDF2F0" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="0" cy="0" r="41" fill="none" stroke="url(#roseGrad)" stroke-width="1" stroke-dasharray="3 2" />
    <text x="0" y="14" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="url(#goldGrad)" text-anchor="middle">M</text>
    <!-- Ornamento floral no topo do monograma -->
    <path d="M 0 -46 C 4 -54, 8 -54, 0 -62 C -8 -54, -4 -54, 0 -46 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Tipografia da Marca -->
  <text x="135" y="94" font-family="'Playfair Display', Georgia, serif" font-size="38" font-weight="700" fill="#2D2424" letter-spacing="1">
    Decorações <tspan fill="url(#roseGrad)" font-style="italic">by Mary</tspan>
  </text>

  <!-- Subtítulo / Slogan Nobre -->
  <text x="138" y="126" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="url(#goldGrad)" letter-spacing="4.5">
    FESTAS &amp; EVENTOS INESQUECÍVEIS
  </text>

  <!-- Linha divisória fina dourada -->
  <line x1="138" y1="140" x2="480" y2="140" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4" />
</svg>
